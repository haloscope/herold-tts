version: '3.8'

services:
  oskar-tts-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: oskar-tts:latest
    container_name: oskar-tts-gpu
    
    # GPU support
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - TTS_DEVICE=cuda:0  # Override default device
    
    # Volume mounts
    volumes:
      - ./audition:/app/audition
      - ./renders:/app/renders
      - ./final:/app/final
      - ./ansagen.yaml:/app/ansagen.yaml:ro
    
    # Working directory
    working_dir: /app/work
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

