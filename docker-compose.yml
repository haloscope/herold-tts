services:
  herold-tts-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: herold-tts:latest
    container_name: herold-tts-gpu
    command: ["python", "-m", "herold.api"]
    ports:
      - "8000:8000"

    # GPU support
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - TTS_DEVICE=cuda:0  # Override default device
    
    # Volume mounts
    volumes:
      - ./data/audition:/app/data/audition
      - ./data/renders:/app/data/renders
      - ./data/final:/app/data/final
      - ./resources/ansagen.yaml:/app/resources/ansagen.yaml:ro
      # HuggingFace model cache (HF_HOME in the Dockerfile). Without this mount the
      # cache lives in the container's writable layer and every image rebuild forces
      # a full model re-download (~3.8-11 GB, see docs/HARDWARE.md). Kept under
      # ./data/ so the uid-999 chown from docs/DEPLOYMENT.md "Volume Permissions"
      # covers it too.
      - ./data/hf-cache:/app/.cache/huggingface

    # Working directory
    working_dir: /app
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

