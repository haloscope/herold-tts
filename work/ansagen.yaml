# Ansagen-Liste für Batch-Rendering
# Format: id, sprache (German|English), text
# 
# Die Stimme (voice_clone_prompt) wird aus audition/reference_design_de.wav
# erzeugt und bleibt über alle Ansagen hinweg identisch.

ansagen:
  # Willkommenansage
  - id: welcome_de
    sprache: German
    text: "Hallo, ich freue mich Sie auf Oskar begrüßen zu dürfen! Hierbei handelt es sich um die Open Source Kommunikations Plattform Schleswig-Holsteins."

  - id: welcome_en
    sprache: English
    text: "Hello, I'm delighted to welcome you to Oscar! This is the Open Source Communication Platform of Schleswig-Holstein."

  - id: unavailable_de
    sprache: German
    text: "Vielen Dank für Ihren Anruf. Momentan kann ihr Anruf nicht persönlich entgegengenommen werden. Bitte versuchen Sie es zu einem späteren Zeitpunkt erneut."
  
  - id: unavailable_en
    sprache: English
    text: "Thank you for calling. We are currently unable to take your call. Please try again at a later time."

  - id: voicemail_de
    sprache: German
    text: "Vielen Dank für Ihren Anruf. Momentan kann ihr Anruf nicht persönlich entgegengenommen werden. Bitte versuchen Sie es zu einem späteren Zeitpunkt erneut."
  
  - id: voicemail_en
    sprache: English
    text: "Thank you for calling. We are currently unable to take your call. Please leave a message and we will respond as soon as possible."
  
  # Weitere Ansagen hier einfügen (id, sprache, text)
