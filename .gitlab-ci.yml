# GitLab CI: Run tests on every push; build and publish container images only on main.
# See docs/adr/0003-ci-image-builds.md.
#
# Runner requirements:
#   - Docker executor with /var/run/docker.sock passed through from the runner host.
#     This preserves the host's layer cache and speeds up subsequent builds.
#   - Network access to Docker Hub, PyPI, and download.pytorch.org.
#   - Project container registry enabled.
#
# Image retention: keep the current and previous version of each image
# (cleanup job, keep_n=2). Always retain the "latest" tag.

stages:
  - test
  - build
  - scan
  - cleanup

# GitLab security scans were restored in v0.4.3 after the previous pipeline
# was removed during restructuring on 2026-07-06. The template jobs (semgrep-sast
# and secret_detection) run in the test stage and publish their findings as
# artifacts (gl-sast-report.json and gl-secret-detection-report.json).
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GPU_IMAGE: $CI_REGISTRY_IMAGE/gpu
  CPU_IMAGE: $CI_REGISTRY_IMAGE/cpu

test:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-test
    paths:
      - .cache/pip
  before_script:
    # CPU wheels match docker/Dockerfile.cpu: no unnecessary CUDA runtime (~150 MB vs ~5 GB)
    - pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch torchaudio
    - pip install --quiet -r requirements.txt
  script:
    - pytest -q --junitxml=pytest-report.xml
  artifacts:
    when: always          # Upload reports even when tests fail (especially then).
    reports:
      junit: pytest-report.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# Shared base for Docker jobs
.docker-job:
  image: docker:27-cli
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' herold/__init__.py | head -1)
    - echo "Building version $VERSION"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-gpu:
  extends: .docker-job
  stage: build
  script:
    - docker build -f docker/Dockerfile -t "$GPU_IMAGE:$VERSION" -t "$GPU_IMAGE:latest" .
    - docker push "$GPU_IMAGE:$VERSION"
    - docker push "$GPU_IMAGE:latest"

build-cpu:
  extends: .docker-job
  stage: build
  script:
    - docker build -f docker/Dockerfile.cpu -t "$CPU_IMAGE:$VERSION" -t "$CPU_IMAGE:latest" .
    - docker push "$CPU_IMAGE:$VERSION"
    - docker push "$CPU_IMAGE:latest"

# Scan newly built images for container CVEs. Report-only for now: review the
# baseline before considering --exit-code 1. GitLab's official container-scanning
# template requires Ultimate, so this job runs Trivy directly. Findings are shown
# in the job log, with JSON artifacts retained for 30 days.
container-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_JOB_TOKEN
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache
  allow_failure: true
  before_script:
    - VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' herold/__init__.py | head -1)
  script:
    - trivy image --severity HIGH,CRITICAL "$GPU_IMAGE:$VERSION"
    - trivy image --severity HIGH,CRITICAL --format json -o trivy-gpu.json "$GPU_IMAGE:$VERSION"
    - trivy image --severity HIGH,CRITICAL "$CPU_IMAGE:$VERSION"
    - trivy image --severity HIGH,CRITICAL --format json -o trivy-cpu.json "$CPU_IMAGE:$VERSION"
  artifacts:
    paths:
      - trivy-gpu.json
      - trivy-cpu.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Retain only the current and preceding image versions (keep_n=2).
# The "latest" tag does not match the version regex and is not deleted.
#
# Requires the masked CI/CD variable REGISTRY_CLEANUP_TOKEN, containing a
# Maintainer-level Project Access Token with the "api" scope. The ordinary
# CI_JOB_TOKEN cannot delete registry tags.
#
# GitLab rate-limits the bulk-delete API to one call per hour per repository.
# Therefore allow_failure is intentional: rapid successive pushes may cause only
# cleanup to fail, without failing the pipeline. A later run can clean up.
cleanup-registry:
  stage: cleanup
  image: alpine:3.22
  allow_failure: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      for repo_id in $(curl -sf --header "PRIVATE-TOKEN: $REGISTRY_CLEANUP_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories" | jq -r '.[].id'); do
        echo "Cleaning registry repository $repo_id (retaining 2 version tags and latest)"
        curl -sf --request DELETE --header "PRIVATE-TOKEN: $REGISTRY_CLEANUP_TOKEN" \
          --data-urlencode 'name_regex_delete=^[0-9]+\.[0-9]+\.[0-9]+$' \
          --data-urlencode 'keep_n=2' \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$repo_id/tags"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
