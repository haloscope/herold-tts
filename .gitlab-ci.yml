stages:
- build
- test
- deploy
- review
- dast
- staging
- canary
- production
- incremental rollout 10%
- incremental rollout 25%
- incremental rollout 50%
- incremental rollout 100%
- performance
- cleanup
- secret-detection
sast:
  stage: test
include:
  - template: Auto-DevOps.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

# --- Changelog-Generierung (additiv, läuft nur bei SemVer-Tag-Push) ---
generate_changelog:
  stage: .post                      # eingebaute Stage, kein Eingriff in deine stages-Liste
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'   # nur echte Releases, RCs/Pre-Releases ignoriert
  before_script:
    - apk add --no-cache curl
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "📝 Generating changelog for version ${VERSION}..."
    
    # curl-Response speichern UND Return-Code checken
    - RESPONSE=$(curl --fail-with-body --request POST \
        --header "PRIVATE-TOKEN: ${CHANGELOG_API_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{\"version\":\"${VERSION}\",\"branch\":\"${CI_DEFAULT_BRANCH}\",\"message\":\"docs: changelog for ${CI_COMMIT_TAG} [skip ci]\"}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/changelog" 2>&1)
    
    EXITCODE=$?
    
    # Explizit prüfen: erfolgreich?
    if [ $EXITCODE -eq 0 ]; then
      echo "✅ Changelog generated for ${VERSION}"
    else
      echo "❌ Changelog generation failed:"
      echo "$RESPONSE"
      exit $EXITCODE
    fi
